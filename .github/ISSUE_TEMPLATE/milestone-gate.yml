name: Milestone gate
description: Un gate (milestone o decisione con data) — non un'attività.
title: "[gate] "
labels: ["milestone"]
body:
  - type: markdown
    attributes:
      value: |
        Un **gate** ha una data-milestone e un esito binario (passa / non passa).
        Deve essere figlio di una epica M. Protocollo: `docs/processi/creazione-issue.md`.
  - type: input
    id: epic
    attributes:
      label: Epica M
      placeholder: "#17 — M0 — Foundation & Setup"
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner (role) — l'assegnatario
      description: "L'account macchina del ruolo che porta il gate. La issue va ASSEGNATA a questo account (gh issue create … --assignee Org-<ruolo>). docs/processi/lavoro.md §1.6"
      options:
        - Org-Marco — Chief Engineer (track/device, track/pto)
        - Org-Alessandro — Chief Software Officer (track/kyma, software, infrastructure)
        - Org-Chiara — Head of Growth (track/growth)
        - Org-Mio — CEO (hub, coordinamento, approvazioni)
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Cosa deve essere vero perché il gate passi.
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Data-milestone
      description: La data del gate (YYYY-MM-DD). Va nel campo Target del board, non in Due.
      placeholder: "2026-11-01"
    validations:
      required: true
  - type: textarea
    id: exit
    attributes:
      label: Exit criteria (binaria)
      description: La condizione verificabile che fa passare il gate.
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Dependencies
      description: Da cosa dipende il gate, o "nessuna".
    validations:
      required: true
